# Railway deployment configuration (config-as-code).
# The PostgreSQL database is a separate service you add in the Railway
# dashboard; this file only describes the web service. See README.md.

[build]
builder = "RAILPACK"
buildCommand = "cd client && npm ci && npm run build && cd ../server && npm ci --omit=dev"

[deploy]
# The server creates missing tables and seeds trivia/jokes itself on startup
# (server/db/setup.js), so no separate pre-deploy step is needed.
startCommand = "cd server && node index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
